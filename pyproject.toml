# Project tooling config. pytest config lives here (pytest.ini was
# folded in); mutmut config stays in setup.cfg (mutmut reads that).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["pharmacy_app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
# A solid default selection: pyflakes (F), pycodestyle (E/W),
# isort (I), bugbear (B), builtins (A), comprehensions (C4),
# simplify (SIM), pyupgrade (UP), flake8-bandit security (S).
select = ["E", "F", "W", "I", "B", "A", "C4", "SIM", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` (S101) is the normal idiom in tests, not a security smell.
"tests/*" = ["S101"]
