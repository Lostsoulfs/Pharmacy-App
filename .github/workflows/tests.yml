# Testing-harness CI.
# Runs the playbook layers on every push/PR and sweeps random seeds
# nightly. Adjust the Python matrix to the versions you support.
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly seed sweep, 03:00 UTC
  workflow_dispatch:

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nox
      - run: nox -s lint types

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci   # thorough profile from conftest.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install nox
      - run: nox -s coverage

  seedsweep:
    # Nightly only: one green run proves "passed for one seed", not
    # "passed". See TESTING_PLAYBOOK.md > Multi-seed sweeps.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nox
      - run: nox -s seedsweep
