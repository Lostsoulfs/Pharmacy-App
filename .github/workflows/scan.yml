name: secret-pii-scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR content (the diff under test)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the trusted scanner from the base branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.base_ref }}
          path: scanner_dir
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Self-test the scanner (trusted copy)
        run: python3 scanner_dir/tools/scan_staged.py --self-test
      - name: Scan PR diff for secrets / personal-tier paths (trusted scanner)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scanner_dir/tools/scan_staged.py --ci --base "origin/${BASE_REF}"
