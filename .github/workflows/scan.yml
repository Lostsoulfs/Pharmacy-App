name: secret-pii-scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR content (the diff under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the trusted scanner from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: scanner_dir
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Self-test the scanner (trusted copy)
        run: python3 scanner_dir/tools/scan_staged.py --self-test
      - name: Scan PR diff for secrets / personal-tier paths (trusted scanner)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scanner_dir/tools/scan_staged.py --ci --base "origin/${BASE_REF}"
